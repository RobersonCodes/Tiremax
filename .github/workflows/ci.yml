name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tiremax
          POSTGRES_PASSWORD: tiremax_pass
          POSTGRES_DB: tiremax_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiremax -d tiremax_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # DATABASE_URL precisa terminar em "_test" — trava de segurança em
      # backend/tests/helpers/testDb.js, pensada pra nunca rodar contra
      # produção. Este banco só existe dentro do container do job.
      DATABASE_URL: postgresql://tiremax:tiremax_pass@localhost:5432/tiremax_erp_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      JWT_EXPIRES_IN: 7d
      NODE_ENV: test
      FRONTEND_URL: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm test

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
