    <!--
      Google tag (gtag.js) — GA4 + Google Ads conversion tracking.
      SETUP REQUIRED before running paid traffic:
      1. Replace G-XXXXXXXXXX below with your real GA4 Measurement ID
         (Google Analytics → Admin → Data Streams → your stream).
      2. Replace AW-XXXXXXXXX with your real Google Ads conversion ID
         (Google Ads → Goals → Conversions).
      3. src/utils/analytics.js has the matching conversion label to update.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
      gtag('config', 'AW-XXXXXXXXX');
    </script>
