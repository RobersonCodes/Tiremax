version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tiremax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tiremax_erp
      POSTGRES_USER: tiremax
      POSTGRES_PASSWORD: tiremax_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tiremax-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiremax -d tiremax_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiremax-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tiremax:tiremax_pass@postgres:5432/tiremax_erp
      JWT_SECRET: your-super-secret-key-change-me
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - tiremax-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tiremax-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - tiremax-net

volumes:
  postgres_data:

networks:
  tiremax-net:
    driver: bridge
